# ============================================================
# 3x-ui 面板 · Clash/Mihomo 全局路由 — v3.5.2（与 JS 覆写同口径）
#
# 用法（二选一）：
# 1. 把本文件的远程地址单独填进面板「设置 → 订阅 → Clash/Mihomo →
#    全局路由规则」，面板会自己定期拉取；
# 2. 或把本文件全文粘贴进同一个字段。
#
# 本文件只含 proxy-groups / rule-providers / rules 三个顶层键——
# 这是全局路由字段唯一会导入的三部分。真实节点由面板生成，
# 切勿自行添加 proxies:，否则会覆盖掉面板生成的节点。
# DNS / Fake-IP 不在此文件内（该字段不接受）：DNS 改进
# （fallback 国外 DoH、fake-ip-filter 补全）只在 JS 覆写里生效。
#
# 与 FlClash-Override-v3.5-Remote.js（v3.5.2）的对应关系：
# - 策略组 24 个、规则集 15 个、规则 171 条，与 JS 生成结果逐项一致；
# - 国内段新增 geosite/cn 规则集补 direct 名单的漏，cncidr 与 GEOIP,CN
#   已去掉 no-resolve，名单外国内站可按解析 IP 兜底直连；
# - 广告规则（reject + category-ads-all）已前置到业务规则之前，
#   「广告拦截」组只保留 REJECT / DIRECT；
# - FCM 已补齐 alt1–alt8-mtalk 共 9 个域名；
# - JS 里「组内列出全部真实节点」在 YAML 里写作 include-all-proxies: true，
#   节点由面板在生成订阅时自动填入，不写死节点名；
# - 地区节点保持扁平单组（简洁优先），不做地区子分组；
# - 图标与 JS 相同的黑白 SVG。
# ============================================================

