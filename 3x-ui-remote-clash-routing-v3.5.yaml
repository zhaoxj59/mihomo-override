# ============================================================
# Personal 3x-ui Remote Routing — v3.5-compatible rules only
#
# Strategy groups are deliberately omitted.
# All proxy-groups are created by Mihomo-Override-v3.5-remote.js,
# preserving the original v3.5 layout and manual node selection.
# Real proxy nodes remain generated by the subscription / 3x-ui.
# Remote MATCH is omitted; the JS override provides the final fallback.
# ============================================================

rule-providers:
  reject:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/personal-reject.txt
    interval: 86400
  icloud:
    type: http
    behavior: domain
    format: text
