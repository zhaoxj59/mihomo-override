  lancidr:
    type: http
    behavior: ipcidr
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/personal-lancidr.txt
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    path: ./ruleset/personal-cncidr.txt
    interval: 86400
  applications:
    type: http
    behavior: classical
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
    path: ./ruleset/personal-applications.txt
    interval: 86400
  ads-meta:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
    path: ./ruleset/personal-category-ads-all.mrs
    interval: 86400
  ads-awavenue:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs
    path: ./ruleset/personal-awavenue-ads.mrs
    interval: 86400

rules:
  # Private / LAN traffic must be handled before other rule sets.
  - RULE-SET,private,DIRECT

  # FCM push has priority over ad lists and broad Google matching.
  - DOMAIN,mtalk.google.com,FCM 推送
  - DOMAIN,alt1-mtalk.google.com,FCM 推送
  - DOMAIN,alt2-mtalk.google.com,FCM 推送

  # Ads: select REJECT to block, or DIRECT to disable blocking.
  - RULE-SET,reject,广告拦截
  - RULE-SET,ads-meta,广告拦截
  - RULE-SET,ads-awavenue,广告拦截

  # Google is separated from general Google traffic.
  - DOMAIN-SUFFIX,play.google.com,Google
  - DOMAIN-SUFFIX,play.googleapis.com,Google
  - DOMAIN-SUFFIX,android.clients.google.com,Google
  - DOMAIN-SUFFIX,services.googleapis.cn,Google

  # AI services, including muse.ai.
