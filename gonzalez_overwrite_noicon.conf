# ============================================================
# OpenClash 覆写模块 — Gonzalez v3.5.2（无图标版）
#
# 与 gonzalez_overwrite.conf 内容相同，仅去掉全部策略组的
# icon 字段：Zashboard 控制面板无法渲染 data:image/svg+xml
# 的图标，会把整串编码当组名显示成乱码；去掉后组名正常显示。
# 24 策略组 / 15 规则集 / 171 条规则；13 个 Loyalsoldier
# 规则集 format 已为 yaml（见同目录说明）。
#
# 用法：先在「覆写模块」里停用/删除旧的 Gonzalez_v352 模块，
# 再导入本文件，启用，重启 OpenClash 生效。
# ============================================================
[YAML]
proxy-groups!:
- name: 地区节点
  type: select
  include-all-proxies: true
- name: YouTube
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: AI
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
