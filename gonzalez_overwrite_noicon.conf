- name: Telegram
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: Twitter
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: Meta
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: TikTok
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: Netflix
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: Disney+
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: Spotify
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: Steam
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: Emby
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: PikPak
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: PayPal
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: 加密货币
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: Google
  type: select
  proxies:
  - 地区节点
  include-all-proxies: true
- name: FCM 推送
  type: select
  proxies:
  - Google
  - 地区节点
  include-all-proxies: true
- name: 国内网站
  type: select
  proxies:
  - DIRECT
  - 地区节点
  include-all-proxies: true
- name: 国际网站
  type: select
  proxies:
  - 地区节点
  - DIRECT
  include-all-proxies: true
- name: 漏网之鱼
  type: select
  proxies:
  - 国际网站
  - 国内网站
  - 地区节点
  - DIRECT
  include-all-proxies: true
- name: 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
