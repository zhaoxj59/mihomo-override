+rule-providers:
  OC-ads:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
    path: "./ruleset/oc-ads.mrs"
    interval: 86400
  OC-cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: "./ruleset/oc-cn.mrs"
    interval: 86400

+proxy-groups:
  - name: OC-Proxy
    type: select
    proxies:
      - PROXY
      - DIRECT
  - name: OC-AI
    type: select
    proxies:
      - OC-Proxy
      - PROXY
      - DIRECT
  - name: OC-Muse
    type: select
    proxies:
      - OC-Proxy
      - PROXY
      - DIRECT
  - name: OC-Google
    type: select
    proxies:
      - OC-Proxy
      - PROXY
      - DIRECT
  - name: OC-FCM
    type: select
    proxies:
      - OC-Google
      - OC-Proxy
      - PROXY
      - DIRECT
  - name: OC-Streaming
    type: select
    proxies:
      - OC-Proxy
      - PROXY
      - DIRECT
  - name: OC-Social
    type: select
    proxies:
      - OC-Proxy
      - PROXY
      - DIRECT
  - name: OC-Ads
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: OC-Domestic
    type: select
    proxies:
      - DIRECT
      - PROXY
  - name: OC-Fallback
    type: select
    proxies:
      - OC-Proxy
      - PROXY
      - DIRECT

+rules:
  - RULE-SET,OC-ads,OC-Ads
  - DOMAIN-SUFFIX,muse.ai,OC-Muse
  - DOMAIN-SUFFIX,meta.ai,OC-Muse
  - DOMAIN-SUFFIX,metaaivm.com,OC-Muse
